# ノートを実行して図と HTML を作り、実験ノートと地図アプリと JupyterLite を GitHub Pages に置く
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements-ci.txt

      - name: Japanese font subset -> fonts/
        run: python tools/make_font_subset.py

      - name: Experiment notebooks from percent scripts (experiments/*.py -> *.ipynb)
        run: jupytext --to ipynb experiments/[0-9]*.py

      - name: Commit generated files once (font subset, experiment notebooks)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true   # 失敗しても配信は続ける（Re-run で古いコミットを見ているときなど）
        run: |
          git fetch origin main
          git add fonts/*.otf experiments/*.ipynb
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update generated files (font subset, experiment notebooks) [skip ci]"
            git push origin HEAD:main
          fi

      - name: Execute the main notebook (figures + executed copy + HTML)
        env:
          KG_FIG_DIR: _figures
        run: |
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=900 \
            --output kg_prime_factorization_executed.ipynb kg_prime_factorization.ipynb
          jupyter nbconvert --to html --TagRemovePreprocessor.enabled=True \
            --TagRemovePreprocessor.remove_input_tags='{"helper"}' \
            --output kg_prime_factorization.html kg_prime_factorization_executed.ipynb

      - name: Check that every experiment notebook runs
        run: |
          for nb in experiments/[0-9]*.ipynb; do
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=600 --output-dir _check "$nb"
          done

      - name: Build JupyterLite (main notebook + experiments + fonts)
        run: |
          mkdir -p _lite/fonts _lite/experiments
          cp kg_prime_factorization.ipynb _lite/
          cp fonts/* _lite/fonts/
          cp experiments/[0-9]*.ipynb experiments/kg_tools.py _lite/experiments/
          jupyter lite build --contents _lite --output-dir dist

      - name: Add the map app, figures, executed notebook and HTML to the site
        run: |
          cp -r app dist/app
          cp -r _figures dist/figures
          cp kg_prime_factorization_executed.ipynb kg_prime_factorization.html dist/
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
