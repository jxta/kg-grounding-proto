<script>

const SVG_NS = "http://www.w3.org/2000/svg";
function pic_lockers() {

  for (let k = 1; k <= K; k++) { for (let j = k; j <= L; j += k) open[j] = !open[j]; for (let j = 1; j <= L; j++) parts.push(`<rect x="${(j-1)*cell+1}" y="${(k-1)*cell+1}" width="${cell-2}" height="${cell-2}" rx="3" fill="${open[j] ? "#111" : "#fff"}" stroke="#ddd" stroke-width=".5"></rect>`); parts.push(`<text x="${L*cell+6}" y="${(k-1)*cell+15}" font-size="10" fill="#777">${k} 人目</text>`); }

function pic_stamps(a = 3, b = 5, upto = 24) {

  const cell = 28, parts = []; for (let x = 1; x <= upto; x++) parts.push(`<rect x="${(x-1)*cell+1}" y="1" width="${cell-2}" height="${cell-2}" rx="4" fill="${ok[x] ? "#111" : "#fff"}" stroke="#bbb" stroke-width=".6"></rect><text x="${(x-1)*cell+cell/2}" y="${cell/2+4}" text-anchor="middle" font-size="11" fill="${ok[x] ? "#fff" : "#111"}">${x}</text>`);
  return `<svg viewBox="0 0 ${upto*cell} ${cell+2}" xmlns="${SVG_NS}"><rect width="${upto*cell}" height="${cell+2}" fill="#fff"></rect>${parts.join("")}</svg>`;

function pic_twosq(N = 60) {
  const cols = 10, cell = 30, parts = [];
  for (let n = 1; n <= N; n++) { const i = n - 1, x = (i % cols) * cell, y = Math.floor(i / cols) * cell, on = twoSq(n); parts.push(`<rect x="${x+1}" y="${y+1}" width="${cell-2}" height="${cell-2}" rx="4" fill="${on ? "#111" : "#fff"}" stroke="#ddd" stroke-width=".5"></rect><text x="${x+cell/2}" y="${y+cell/2+4}" text-anchor="middle" font-size="11" fill="${on ? "#fff" : "#999"}">${n}</text>`); }
  return `<svg viewBox="0 0 ${cols*cell} ${Math.ceil(N/cols)*cell}" xmlns="${SVG_NS}"><rect width="${cols*cell}" height="${Math.ceil(N/cols)*cell}" fill="#fff"></rect>${parts.join("")}</svg>`;

function pic_partial_sieve() {

function pic_cards72() {
  const ds = [1, 2, 3, 4, 6, 8, 9, 12, 18, 24, 36, 72], pos = [[40, 30], [120, 22], [200, 40], [290, 26], [60, 86], [150, 78], [240, 92], [330, 70], [90, 136], [180, 128], [270, 142], [350, 124]];

function pic_mod4() {

const PUZZLES = [

function addCard(c) { const card = Object.assign({id: "c" + Date.now().toString(36) + (_cid++), type: "notice", text: "", puzzle: ui.puzzle, parent: null, links: [], book: null, note: "", status: "", t: now()}, c); state.cards.push(card); saveState(); return card; }

// 記録の照合：同じノート・同じ条件の記録どうしで、結果（data）が同じか。公開の記録（CI が実行したもの）とも比べる
const canon = {};
async function fetchCanon(exp) {
  if (String(exp).startsWith("ai_")) return null;
  if (canon[exp] !== undefined) return canon[exp];
  try { const r = await fetch(canonUrl(exp), {cache: "no-store"}); canon[exp] = r.ok ? await r.json() : null; } catch (e) { canon[exp] = null; }
  return canon[exp];
}
function compareRuns(a, b) {
  if (!a || !b) return null;
  const sameNb = a.provenance?.nb_sha && b.provenance?.nb_sha && a.provenance.nb_sha === b.provenance.nb_sha;
  const sameParams = stable(a.params || {}) === stable(b.params || {});
  const sameData = stable(a.data || {}) === stable(b.data || {});
  return {sameNb, sameParams, sameData};
}
function receiveRun(msg, source) {
  const run = Object.assign({id: "r" + Date.now().toString(36) + (_cid++), received: now(), source: source || "notebook"}, msg);
  state.runs.push(run); saveState();
  fetchCanon(run.exp).then(() => { if (ui.view === "runs") renderRuns(); if (ui.view === "door" && ui.puzzle) renderPuzzle(ui.puzzle); });
  if (ui.view === "runs") renderRuns(); else if (ui.view === "door" && ui.puzzle === run.exp) renderPuzzle(run.exp);
  toast(`記録が届きました：${(pz(run.exp) || {title: run.exp}).title}`);
  return run;
}
function runBadges(run) {
  const b = [];
  const c = canon[run.exp];
  if (String(run.exp).startsWith("ai_")) { b.push(`<span class="badge soft">自作の実験（公開の記録はない）</span>`); const m = (state.mine || []).find(x => x.id === run.exp); if (m && m.sha && run.provenance?.nb_sha) b.push(`<span class="badge ${m.sha === run.provenance.nb_sha ? "ok" : "ng"}">${m.sha === run.provenance.nb_sha ? "作ったときの版と同じ" : "作ったあとにノートを編集した"}</span>`); }
  else if (c) { const cmp = compareRuns(run, c); b.push(`<span class="badge ${cmp.sameNb ? "ok" : "ng"}" title="公開記録のノートと同じ版か">${cmp.sameNb ? "ノートは公開と同じ版" : "ノートの版がちがう"}</span>`); if (cmp.sameParams) b.push(`<span class="badge ${cmp.sameData ? "ok" : "ng"}">${cmp.sameData ? "結果は公開の記録と一致" : "結果が公開の記録とちがう"}</span>`); else b.push(`<span class="badge soft">条件が公開の記録とちがう</span>`); }
  else if (c === null && !String(run.exp).startsWith("ai_")) b.push(`<span class="badge soft">公開の記録は取得できず</span>`);
  const prev = state.runs.filter(r => r.id !== run.id && r.exp === run.exp && stable(r.params || {}) === stable(run.params || {}) && r.received < run.received).pop();
  if (prev) { const cmp = compareRuns(run, prev); b.push(`<span class="badge ${cmp.sameData ? "ok" : "ng"}">${cmp.sameData ? "前回の自分の記録と一致" : "前回の自分の記録とちがう"}</span>`); }
  if (run.hand) b.push(`<span class="badge soft">手の結果つき</span>`);
  return b.join(" ");
}

// =====================================================================
// 実験を作る：問い・手の結果・予想は生徒が書く。機械の部分（コード）を AI かひな形が書く。
// できたノートは JupyterLite に届き、実行記録は他のパズルと同じ形で地図につく
// =====================================================================
const PY_PREDS = [
  {id: "prime", name: "素数", py: "sympy.isprime(n)"},
  {id: "composite", name: "合成数", py: "n > 1 and not sympy.isprime(n)"},
  {id: "odd", name: "奇数", py: "n % 2 == 1"},
  {id: "even", name: "偶数", py: "n % 2 == 0"},
  {id: "square", name: "平方数", py: "math.isqrt(n) ** 2 == n"},
  {id: "divk", name: "約数がちょうど {k} 個", args: [["k", 3]], py: "sympy.divisor_count(n) == {k}"},
  {id: "divodd", name: "約数が奇数個", py: "sympy.divisor_count(n) % 2 == 1"},
  {id: "modr", name: "{m} で割ると {r} 余る", args: [["m", 4], ["r", 1]], py: "n % {m} == {r}"},
  {id: "multm", name: "{m} で割り切れる", args: [["m", 3]], py: "n % {m} == 0"},
  {id: "dsum", name: "桁の和が {m} の倍数", args: [["m", 3]], py: "sum(map(int, str(n))) % {m} == 0"},
  {id: "sq2", name: "2 つの平方数の和", py: "any(math.isqrt(n - a * a) ** 2 == n - a * a for a in range(0, math.isqrt(n) + 1))"},
  {id: "pr2", name: "2 つの素数の和", py: "any(sympy.isprime(p) and sympy.isprime(n - p) for p in range(2, n // 2 + 1))"},
  {id: "any", name: "どんな数でも", py: "True"},
];
const pyPred = (sel) => { const p = PY_PREDS.find(x => x.id === sel.id); let code = p.py, name = p.name; for (const [k, d] of (p.args || [])) { const v = sel.args?.[k] ?? d; code = code.split("{" + k + "}").join(String(v)); name = name.split("{" + k + "}").join(String(v)); } return {code, name}; };
const slugify = t => { const s = (t || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 24); return /[a-z]/.test(s) ? s : "exp"; };
const FIRST_CELL = 'import sys; sys.path.insert(0, "."); sys.path.insert(0, "../experiments")\nimport numpy, matplotlib, sympy   # JupyterLite はこの行を見て部品を読み込む（消さない）\nfrom kg_tools import *';
function pyStr(s) { return JSON.stringify(String(s)); }
// JupyterLite への受け渡し（経路 2）：受け取りノート 00_receive.ipynb が want_notebook を送ってきたら、送る準備をしているノートを返す
let outbox = null, nbChannel = null;
function postOutbox() { if (!outbox || !nbChannel) return; nbChannel.postMessage(JSON.stringify({type: "notebook", name: outbox.name, ipynb: outbox.ipynb})); }
const FORBID = [/import\s+(requests|urllib|socket|subprocess|shutil|http|js)\b/, /\bos\.(system|popen|remove|unlink|rmdir)\b/, /\bopen\s*\(/, /\beval\s*\(/, /\bexec\s*\(/, /!\s*pip/, /\bfetch\(/];
async function nbSha(cells) {
  // kg_tools._nb_sha と同じ決め方：手の結果を書くセルを除き、本文を改行でつないで SHA-256 の先頭 16 桁
  const parts = cells.filter(c => !String(c.source).includes("自分の結果に書き換える")).map(c => String(c.source));
  if (!(typeof crypto !== "undefined" && crypto.subtle)) return null;
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(parts.join("\n")));
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}

// ひな形：A の数は全部 B？／A の数はいくつ？ を N まで
function templateCells(spec) {
  const A = pyPred(spec.A), B = spec.B ? pyPred(spec.B) : null, N = spec.N, id = spec.id, nb = spec.notebook;
  const cells = [];
  cells.push({type: "markdown", source: `# ${spec.title}\n\n${spec.ask}\n\n## 手で（物理的な実験）\n\n${spec.hand_text}\n\n**記録すること**：${spec.hand_record || "見えたこと、数えたこと"}`});
  cells.push({type: "code", source: FIRST_CELL + `\n\n# 手で見た結果（自分の結果に書き換える）\nhand_examples = ${spec.hand_examples || "[]"}   # 手で確かめた数（当てはまった数など）\nhand_note = ${pyStr(spec.hand_result || "")}`});
  cells.push({type: "markdown", source: `## 機械で\n\n${spec.form === "count" ? `1〜N で「${A.name}」の数を数える。` : `「${A.name}の数は、全部${B.name}？」を、まず手でやった範囲で、次に N まで機械で試す。`}手の結果と食い違ったら、どちらが間違えたかを考える（機械が正しいとは限らない）。`});
  cells.push({type: "code", source: `def is_A(n):\n    return ${A.code}\n${B ? `def is_B(n):\n    return ${B.code}\n` : ""}\nN_hand = ${spec.N_hand || 30}\nA_hand = [n for n in range(1, N_hand + 1) if is_A(n)]\nprint("手でやった範囲（1〜", N_hand, "）で「${A.name}」の数：", A_hand)\nif hand_examples:\n    print("手の例との食い違い：", sorted(set(hand_examples) ^ set(A_hand)) or "なし")\n${B ? `ex_hand = [n for n in A_hand if not is_B(n)]\nprint("そのうち「${B.name}」でないもの：", ex_hand or "なし")` : ""}`});
  cells.push({type: "markdown", source: `## もっと先へ・予想を試す\n\n予想：${spec.guess || "（自分の言葉で書く）"}`});
  if (spec.form === "count") cells.push({type: "code", source: `guess = ${pyStr(spec.guess || "")}\nN = ${N}\nA_all = [n for n in range(1, N + 1) if is_A(n)]\nprint(f"1〜{N} で「${A.name}」の数：{len(A_all)} 個。最初の 30 個：", A_all[:30])`});
  else cells.push({type: "code", source: `guess = ${pyStr(spec.guess || "")}\nN = ${N}\nA_all = [n for n in range(1, N + 1) if is_A(n)]\ncounter = [n for n in A_all if not is_B(n)]\nprint(f"「${A.name}の数は、全部${B.name}」を 1〜{N} で試した：当てはまる数 {len(A_all)} 個のうち、反例", counter[:12] or "なし")\nprint("反例がなくても、N の先のことは機械には分からない")`});
  cells.push({type: "markdown", source: `## 記録を送る\n\n手の結果・機械の結果・条件・このノートの版を地図に届ける。`});
  cells.push({type: "code", source: spec.form === "count"
    ? `report(${pyStr(id)}, f"1〜{N} で「${A.name}」の数は {len(A_all)} 個。手のメモ：{hand_note}",\n       data={"count": len(A_all), "first": A_all[:30], "N": N}, hand={"examples": hand_examples, "note": hand_note}, params={"N": N, "N_hand": N_hand}, notebook=${pyStr(nb)})`
    : `report(${pyStr(id)}, f"予想「{guess}」（${A.name} → ${B.name}）は 1〜{N} で{'反例なし' if not counter else '反例あり：' + str(counter[:5])}。手のメモ：{hand_note}",\n       data={"total": len(A_all), "counter": counter[:12], "N": N}, hand={"examples": hand_examples, "note": hand_note}, params={"N": N, "N_hand": N_hand}, notebook=${pyStr(nb)})`});
  return cells;
}

// 生成 AI：コードだけを書かせる。問い・手の結果・予想は生徒の文をそのまま渡す
async function llmCells(spec) {
  const sys = `あなたは中学生の「手と機械の実験室」で、Jupyter ノートの機械の部分を書く係です。生徒が「問い」「手でやったこと・見えたこと」「予想」「機械に頼むこと」を書きます。あなたはそれをそのまま使い、コードを書きます。答えや定理を先に教えないこと。
守ること：
- 出力は JSON だけ：{"cells":[{"type":"markdown","source":"…"},{"type":"code","source":"…"}, …]}
- 1 つ目の code セルは必ず次の 3 行で始める（変えない）：\n${FIRST_CELL}\n  その続きに「手で見た結果」のセル内容を置く：コメント「# 手で見た結果（自分の結果に書き換える）」の下に、生徒の手の結果を Python の値として（例：hand_examples = [...]、hand_note = "..."）。この文字列「自分の結果に書き換える」は必ず入れる
- 機械の部分は Python 標準ライブラリ＋ math, random, numpy, sympy, matplotlib.pyplot(plt) だけ。ファイル・ネットワークは使わない。計算は N ≤ 100000、ループは 1 千万回以下
- kg_tools の道具も使える：sieve_grid(n)、factor_tree(n)/leaves(t)/show_trees([t], [題])、divisor_grid(n)、prime_race(N)、euclid_numbers(k)、factorization_str(n)
- 必ず「手でやった範囲を機械でもやり、手の結果と照らす」セルを入れる（食い違いを表示。機械が正しいとは限らない、と書く）
- 必ず「もっと先へ」（大きい N）と「予想を試す」（guess = "…" という文字列と、予想を式にした関数、反例を探す）を入れる。反例がなくても N の先は分からない、と書く
- 最後の code セルは report(${JSON.stringify(spec.id)}, <一文の要約 f 文字列>, data={機械の結果（同じ条件なら同じ値）}, hand={手の結果}, params={条件}, notebook=${JSON.stringify(spec.notebook)}) で終える
- markdown は短く、やさしい日本語。見出しは「手で」「機械で」「もっと先へ・予想を試す」「記録を送る」`;
  const user = `題名：${spec.title}\n問い：${spec.ask}\n手でやったこと・見えたこと：${spec.hand_text}\n手の結果（数や一覧）：${spec.hand_result}\n予想：${spec.guess}\n機械に頼むこと：${spec.ask_machine}\nどこまで（N）：${spec.N}`;
  const r = await fetch("https://api.anthropic.com/v1/messages", {method: "POST", headers: {"content-type": "application/json", "x-api-key": settings.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"}, body: JSON.stringify({model: settings.model, max_tokens: 4000, system: sys, messages: [{role: "user", content: user}]})});
  if (!r.ok) throw new Error("API " + r.status);
  const data = await r.json(); const raw = (data.content || []).filter(c => c.type === "text").map(c => c.text).join("\n").trim();
  const obj = JSON.parse(raw.replace(/^```(json)?/, "").replace(/```$/, "").trim());
  if (!obj.cells || !Array.isArray(obj.cells)) throw new Error("cells がない");
  return obj.cells.map(c => ({type: c.type === "code" ? "code" : "markdown", source: String(c.source || "")}));
}
function validateCells(cells, spec) {
  const code = cells.filter(c => c.type === "code").map(c => c.source).join("\n");
  const problems = [];
  if (!code.includes("from kg_tools import *")) problems.push("最初のセルに from kg_tools import * がない");
  if (!code.includes("import numpy, matplotlib, sympy")) problems.push("最初のセルに import numpy, matplotlib, sympy がない（JupyterLite で部品が読めない）");
  if (!code.includes("自分の結果に書き換える")) problems.push("「手で見た結果（自分の結果に書き換える）」のセルがない");
  if (!code.includes(`report(${JSON.stringify(spec.id)}`)) problems.push(`最後に report(${JSON.stringify(spec.id)}, …) がない`);
  for (const re of FORBID) if (re.test(code)) problems.push("使ってはいけない書き方がある：" + code.match(re)[0]);
  if (/while\s+True/.test(code)) problems.push("終わらないかもしれない繰り返し（while True）がある。読んで確かめる");
  if (/range\(\s*\d{8,}/.test(code)) problems.push("1 千万回を超える繰り返しがある。ブラウザの中では重すぎる");
  return problems;
}
function toIpynb(cells) {
  return {cells: cells.map(c => c.type === "code" ? {cell_type: "code", execution_count: null, metadata: {}, outputs: [], source: c.source} : {cell_type: "markdown", metadata: {}, source: c.source}),
    metadata: {kernelspec: {display_name: "Python 3 (ipykernel)", language: "python", name: "python3"}, language_info: {name: "python"}}, nbformat: 4, nbformat_minor: 5};
}
function cellsHtml(cells) { return (cells || []).map(c => c.type === "code" ? `<pre class="cell">${esc(c.source)}</pre>` : `<div class="md-cell">${esc(c.source)}</div>`).join(""); }
// JupyterLite のブラウザ保存（IndexedDB）に直接書く：同じサイトなので同じ保存場所が見える。だめなら .ipynb を保存して手で入れる
function liteStorageName() { const base = new URL(settings.liteBase.endsWith("/") ? settings.liteBase : settings.liteBase + "/", location.href).pathname; return "JupyterLite Storage - " + base; }
function writeToLite(path, nbJson) {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") return reject(new Error("no indexedDB"));
    const name = liteStorageName();
    const open = (version) => {
      const req = version ? indexedDB.open(name, version) : indexedDB.open(name);
      req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains("files")) db.createObjectStore("files"); };
      req.onerror = () => reject(req.error || new Error("open failed"));
      req.onsuccess = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("files")) { const v = db.version + 1; db.close(); return open(v); }
        const now_ = new Date().toISOString(), size = new TextEncoder().encode(JSON.stringify(nbJson)).length;
        const rec = {name: path.split("/").pop(), path, last_modified: now_, created: now_, format: "json", mimetype: "application/json", content: nbJson, size, writable: true, type: "notebook"};
        const tx = db.transaction("files", "readwrite"); tx.objectStore("files").put(rec, path);
        tx.oncomplete = () => { db.close(); resolve(true); }; tx.onerror = () => { db.close(); reject(tx.error || new Error("write failed")); };
      };
    };
    open();
  });
}
function downloadNotebook(p) { const blob = new Blob([JSON.stringify(toIpynb(p.cells), null, 1)], {type: "application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = p.notebook; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
async function deliverNotebook(p) {
  outbox = {name: p.notebook, ipynb: toIpynb(p.cells)};        // 経路 2 の準備（受け取りノートが取りに来る）
  try { await writeToLite("puzzles/" + p.notebook, toIpynb(p.cells)); toast("JupyterLite に置きました。開きます"); window.open(nbUrl(p.notebook), "_blank"); return "direct"; }
  catch (e) { toast("直接は置けなかった。受け取りノート（00_receive.ipynb）で受け取るか、.ipynb を保存してアップロードしてください"); window.open(nbUrl("00_receive.ipynb"), "_blank"); return "receive"; }
}

    const read = () => {
