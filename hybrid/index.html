<script>

const SVG_NS = "http://www.w3.org/2000/svg";

}
function pic_stamps(a = 3, b = 5, upto = 24) {

  const cell = 28, parts = []; for (let x = 1; x <= upto; x++) parts.push(`<rect x="${(x-1)*cell+1}" y="1" width="${cell-2}" height="${cell-2}" rx="4" fill="${ok[x] ? "#111" : "#fff"}" stroke="#bbb" stroke-width=".6"></rect><text x="${(x-1)*cell+cell/2}" y="${cell/2+4}" text-anchor="middle" font-size="11" fill="${ok[x] ? "#fff" : "#111"}">${x}</text>`);
  return `<svg viewBox="0 0 ${upto*cell} ${cell+2}" xmlns="${SVG_NS}"><rect width="${upto*cell}" height="${cell+2}" fill="#fff"></rect>${parts.join("")}</svg>`;

function pic_twosq(N = 60) {
  const cols = 10, cell = 30, parts = [];
  for (let n = 1; n <= N; n++) { const i = n - 1, x = (i % cols) * cell, y = Math.floor(i / cols) * cell, on = twoSq(n); parts.push(`<rect x="${x+1}" y="${y+1}" width="${cell-2}" height="${cell-2}" rx="4" fill="${on ? "#111" : "#fff"}" stroke="#ddd" stroke-width=".5"></rect><text x="${x+cell/2}" y="${y+cell/2+4}" text-anchor="middle" font-size="11" fill="${on ? "#fff" : "#999"}">${n}</text>`); }
  return `<svg viewBox="0 0 ${cols*cell} ${Math.ceil(N/cols)*cell}" xmlns="${SVG_NS}"><rect width="${cols*cell}" height="${Math.ceil(N/cols)*cell}" fill="#fff"></rect>${parts.join("")}</svg>`;

function pic_partial_sieve() {

function pic_cards72() {

function pic_infinite() {

function pic_mod4() {

  for (let n = 1; n <= 100; n++) { const i = n - 1, x = (i % cols) * cell, y = Math.floor(i / cols) * cell, p = isPrime(n), fill = !p ? "#fff" : n === 2 ? "#fff" : (n % 4 === 1 ? "#bdbdbd" : "#111"); parts.push(`<rect x="${x+1}" y="${y+1}" width="${cell-2}" height="${cell-2}" rx="4" fill="${fill}" stroke="${p ? "#111" : "#ddd"}" stroke-width="${p ? 1 : .5}"></rect><text x="${x+cell/2}" y="${y+cell/2+4}" text-anchor="middle" font-size="11" fill="${fill === "#111" ? "#fff" : p ? "#111" : "#bbb"}">${n}</text>`); }

const PUZZLES = [

const pz = id => PUZZLES.find(p => p.id === id);
const BOOK = {divisor_multiple: "約数と倍数", composite: "合成数", prime: "素数", factorization: "素因数分解", one_not_prime: "1は素数ではない", sieve: "エラトステネスの篩", exponent: "累乗の表し方", trial_division: "素因数分解の手順", uniqueness: "分解はただ一通り（一意性）", square: "平方数", gcd_lcm: "最大公約数・最小公倍数", divisor_count: "約数の個数", infinite_primes: "素数は無限にある", prime_race: "素数の偏り（4で割った余り）"};
const TYPES = {q: "問い", notice: "気づき", guess: "予想", rule: "きまり", hand: "手でやった"};
const SEEDS = [["もっと先", c => `「${c.text}」は、もっと大きい数でも同じ？`], ["変えてみる", c => `「${c.text}」の条件を変えたら（3 と 5 を 4 と 7 に、台を 5 × 8 に…）どうなる？`], ["逆は？", c => `「${c.text}」の逆は言える？`], ["なぜ？", c => `「${c.text}」は、なぜそうなる？ 手でやったときに何が起きていた？`], ["反例さがし", c => `「${c.text}」が外れる例はある？ 機械に探させる`], ["別のパズルと", c => `「${c.text}」は、別のパズルで見たことと同じ？`]];

// =====================================================================
// 状態：カード（地図）と記録（ノートからの来歴つき結果）
// =====================================================================
let state, settings, ui = {view: "door", puzzle: null, selected: null};
function newState(name) { return {name, created: now(), cards: [], runs: [], log: []}; }
function loadState() { try { const s = JSON.parse(localStorage.getItem(STORE) || "null"); if (s && s.cards) { s.runs = s.runs || []; return s; } } catch (e) {} return null; }
function saveState() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
function loadSettings() { const d = {liteBase: "../", liteUI: "notebooks", runsBase: "../runs/"}; try { return Object.assign(d, JSON.parse(localStorage.getItem(SETTINGS) || "{}")); } catch (e) { return d; } }
function saveSettings() { try { localStorage.setItem(SETTINGS, JSON.stringify(settings)); } catch (e) {} }
let _cid = 0;
const nbUrl = file => { const b = settings.liteBase.endsWith("/") ? settings.liteBase : settings.liteBase + "/"; return `${b}${settings.liteUI}/index.html?path=puzzles/${file}`; };
const runUrl = id => { const b = settings.runsBase.endsWith("/") ? settings.runsBase : settings.runsBase + "/"; return `${b}${id}.html`; };
const canonUrl = id => { const b = settings.runsBase.endsWith("/") ? settings.runsBase : settings.runsBase + "/"; return `${b}evidence_${id}.json`; };
function addCard(c) { const card = Object.assign({id: "c" + Date.now().toString(36) + (_cid++), type: "notice", text: "", puzzle: ui.puzzle, parent: null, links: [], book: null, note: "", status: "", t: now()}, c); state.cards.push(card); saveState(); return card; }
const cardById = id => state.cards.find(c => c.id === id);
const runById = id => state.runs.find(r => r.id === id);

// 記録の照合：同じノート・同じ条件の記録どうしで、結果（data）が同じか。公開の記録（CI が実行したもの）とも比べる
const canon = {};
async function fetchCanon(exp) {
  if (canon[exp] !== undefined) return canon[exp];
  try { const r = await fetch(canonUrl(exp), {cache: "no-store"}); canon[exp] = r.ok ? await r.json() : null; } catch (e) { canon[exp] = null; }
  return canon[exp];
}
function compareRuns(a, b) {
  if (!a || !b) return null;
  const sameNb = a.provenance?.nb_sha && b.provenance?.nb_sha && a.provenance.nb_sha === b.provenance.nb_sha;
  const sameParams = stable(a.params || {}) === stable(b.params || {});
  const sameData = stable(a.data || {}) === stable(b.data || {});
  return {sameNb, sameParams, sameData};
}
function receiveRun(msg, source) {
  const run = Object.assign({id: "r" + Date.now().toString(36) + (_cid++), received: now(), source: source || "notebook"}, msg);
  state.runs.push(run); saveState();
  fetchCanon(run.exp).then(() => { if (ui.view === "runs") renderRuns(); if (ui.view === "door" && ui.puzzle) renderPuzzle(ui.puzzle); });
  if (ui.view === "runs") renderRuns(); else if (ui.view === "door" && ui.puzzle === run.exp) renderPuzzle(run.exp);
  toast(`記録が届きました：${(pz(run.exp) || {title: run.exp}).title}`);
  return run;
}
function runBadges(run) {
  const b = [];
  const c = canon[run.exp];
  if (c) { const cmp = compareRuns(run, c); b.push(`<span class="badge ${cmp.sameNb ? "ok" : "ng"}" title="公開記録のノートと同じ版か">${cmp.sameNb ? "ノートは公開と同じ版" : "ノートの版がちがう"}</span>`); if (cmp.sameParams) b.push(`<span class="badge ${cmp.sameData ? "ok" : "ng"}">${cmp.sameData ? "結果は公開の記録と一致" : "結果が公開の記録とちがう"}</span>`); else b.push(`<span class="badge soft">条件が公開の記録とちがう</span>`); }
  else if (c === null) b.push(`<span class="badge soft">公開の記録は取得できず</span>`);
  const prev = state.runs.filter(r => r.id !== run.id && r.exp === run.exp && stable(r.params || {}) === stable(run.params || {}) && r.received < run.received).pop();
  if (prev) { const cmp = compareRuns(run, prev); b.push(`<span class="badge ${cmp.sameData ? "ok" : "ng"}">${cmp.sameData ? "前回の自分の記録と一致" : "前回の自分の記録とちがう"}</span>`); }
  if (run.hand) b.push(`<span class="badge soft">手の結果つき</span>`);
  return b.join(" ");
}

// =====================================================================
// 入口：パズル一覧 → パズルの頁（絵・問い／手で／ノートで／気づき）
// =====================================================================
function renderDoor() {
  const el = $("#view-door");
  if (ui.puzzle) return renderPuzzle(ui.puzzle);
  const grid = g => `<div class="grid">${PUZZLES.filter(p => p.group === g).map(p => `<div class="pz" data-id="${p.id}">${p.pic()}<div class="t">${esc(p.title)}</div><div class="ask">${esc(p.ask)}</div></div>`).join("")}</div>`;
  el.innerHTML = `<h2>数のパズル</h2><p class="muted">答えは書いていない。まず絵を見て、次に手で（物を動かして）、それからノートで（機械に手伝わせて）。分かったことは自分の言葉で地図に。</p>
    <h3>素数と素因数分解（単元）</h3>${grid("unit")}
    <h3 style="margin-top:22px">もう少し遠くへ</h3>${grid("extra")}`;
  el.querySelectorAll(".pz").forEach(d => d.addEventListener("click", () => { ui.puzzle = d.dataset.id; renderPuzzle(ui.puzzle); }));
}
function renderPuzzle(id) {
  const el = $("#view-door"), p = pz(id), runs = state.runs.filter(r => r.exp === id), cards = state.cards.filter(c => c.puzzle === id);
  fetchCanon(id).then(c => { if (c && ui.puzzle === id) { const box = el.querySelector("#pz-runs"); if (box) box.innerHTML = runsHtml(runs); } });
  el.innerHTML = `<div class="pzpage"><div class="row"><button class="quiet small" id="pz-back">← パズル一覧</button></div>
    <h2>${esc(p.title)}</h2>${p.pic()}<p style="font-size:15px">${esc(p.ask)}</p>
    <div class="cols">
      <div class="box"><h3>手で</h3><div><b>用意するもの</b>：${esc(p.hand.items)}</div><ol class="steps">${p.hand.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol><div class="muted">記録すること：${esc(p.hand.record)}</div>
        <div class="row"><button class="primary small" id="pz-hand">手でやったことを書く</button></div>
        ${cards.filter(c => c.type === "hand").map(c => `<div class="result">${esc(c.text)} <span class="muted">${esc(c.t)}</span></div>`).join("")}</div>
      <div class="box"><h3>ノートで</h3><div class="muted">手の結果をノートに書き込み、機械と照らし合わせ、もっと先まで試す。最後のセルで記録（結果・条件・ノートの版）がここに届く。</div>
        <div class="row"><a href="${esc(nbUrl(p.notebook))}" target="_blank" rel="noopener"><button class="small">ノートを開く（JupyterLite）</button></a><a href="${esc(runUrl(id))}" target="_blank" rel="noopener"><button class="small quiet">公開の実行記録を見る</button></a></div>
        <div class="muted">手元の Jupyter で動かした場合は、できた <code>evidence_${esc(id)}.json</code> を「記録」の頁で読み込む。</div>
        <h3>届いた記録（${runs.length}）</h3><div id="pz-runs">${runsHtml(runs)}</div></div>
    </div>
    <div class="box" style="margin-top:14px"><h3>気づき・予想・きまり</h3>
      <div class="row"><button class="small" data-new="notice">気づき</button><button class="small" data-new="q">問い</button><button class="small" data-new="guess">予想</button><button class="small" data-new="rule">きまり</button></div>
      ${cards.filter(c => c.type !== "hand").map(cardHtml).join("") || '<p class="muted">まだありません。</p>'}</div></div>`;
  el.querySelector("#pz-back").addEventListener("click", () => { ui.puzzle = null; renderDoor(); });
  el.querySelector("#pz-hand").addEventListener("click", () => { const t = prompt(`${p.title}：手でやって見たこと（何を使って、何が起きた？ 自分の言葉で）`, ""); if (t && t.trim()) { addCard({type: "hand", text: t.trim(), puzzle: id, links: [{kind: "hand", t: now()}]}); renderPuzzle(id); } });
  el.querySelectorAll("[data-new]").forEach(b => b.addEventListener("click", () => { const t = prompt({notice: "気づき（自分の言葉で）", q: "問い", guess: "予想（あとで機械に試させる）", rule: "きまり（理由も書けたら書く）"}[b.dataset.new], ""); if (t && t.trim()) { addCard({type: b.dataset.new, text: t.trim(), puzzle: id}); renderPuzzle(id); } }));
  bindCardOps(el, () => renderPuzzle(id));
  bindRunOps(el, () => renderPuzzle(id));
}
function runsHtml(runs) {
  if (!runs.length) return '<p class="muted">まだ届いていません。ノートの最後のセルを実行すると届きます。</p>';
  return runs.slice().reverse().map(r => `<div class="run" data-run="${r.id}"><div class="h"><b>${esc(r.provenance?.t || r.t)}</b> ${runBadges(r)}</div>
    <div>${esc(r.summary)}</div>
    <div class="muted">ノート <code>${esc(r.provenance?.notebook || "?")}</code> 版 <code>${esc(r.provenance?.nb_sha || "?")}</code>／${esc(r.provenance?.platform || "?")}／条件 <code>${esc(JSON.stringify(r.params || {}))}</code></div>
    <div class="row"><button class="small" data-attach="${r.id}">この記録をカードにつける</button><a href="${esc(nbUrl((pz(r.exp) || {}).notebook || ""))}" target="_blank" rel="noopener"><button class="small quiet">同じノートをもう一度</button></a><button class="small quiet" data-rundel="${r.id}">消す</button></div></div>`).join("");
}
function bindRunOps(el, rerender) {
  el.querySelectorAll("[data-attach]").forEach(b => b.addEventListener("click", () => {
    const r = runById(b.dataset.attach); const cands = state.cards.filter(c => c.puzzle === r.exp && c.type !== "hand");
    const list = cands.map((c, i) => `${i + 1}: [${TYPES[c.type]}] ${c.text}`).join("\n");
    const t = prompt(`この記録をどのカードにつける？（番号。0 で新しい気づきカードを作る）\n${list || "（まだカードがない：0 で新しく作る）"}`, cands.length ? "1" : "0");
    if (t === null) return; const i = +t;
    let card = i >= 1 && i <= cands.length ? cands[i - 1] : null;
    if (!card) { const txt = prompt("新しい気づきカード（自分の言葉で。記録の文をそのまま写さない）", ""); if (!txt || !txt.trim()) return; card = addCard({type: "notice", text: txt.trim(), puzzle: r.exp}); }
    card.links.push({kind: "run", run: r.id, t: now()}); if (!card.links.some(l => l.kind === "notebook")) card.links.push({kind: "notebook", file: (pz(r.exp) || {}).notebook, t: now()}); saveState(); rerender(); toast("カードに記録をつけました");
  }));
  el.querySelectorAll("[data-rundel]").forEach(b => b.addEventListener("click", () => { if (!confirm("この記録を消す？（カードについているリンクも外れる）")) return; state.runs = state.runs.filter(r => r.id !== b.dataset.rundel); state.cards.forEach(c => c.links = c.links.filter(l => l.run !== b.dataset.rundel)); saveState(); rerender(); }));
}

// =====================================================================

// =====================================================================
function renderRuns() {

  PUZZLES.forEach(p => fetchCanon(p.id));
  el.innerHTML = `<h2>記録</h2><p class="muted">ノートの最後のセルから届いた記録。結果（data）と条件（params）と、ノート本文の指紋（nb_sha）が入っている。同じ版のノートを同じ条件で動かせば同じ結果になる——それが再現できる記録。公開の記録（CI が同じノートを実行したもの）とも照らす。</p>
    <div class="row"><label><button class="small" onclick="this.nextElementSibling.click()">記録ファイル（evidence_*.json）を読み込む</button><input type="file" id="r-import" accept="application/json" multiple style="display:none"></label><span class="muted">手元の Jupyter で動かしたとき用</span></div>
    ${runs.length ? runs.map(r => `<div class="run" data-run="${r.id}"><div class="h"><b>${esc((pz(r.exp) || {title: r.exp}).title)}</b> <span class="muted">${esc(r.provenance?.t || r.t)}</span> ${runBadges(r)}</div>
      <div>${esc(r.summary)}</div>
      <details><summary class="muted">中身</summary><table class="tbl"><tr><th>ノート</th><td><code>${esc(r.provenance?.notebook || "?")}</code> 版 <code>${esc(r.provenance?.nb_sha || "?")}</code>（${esc(r.provenance?.platform || "?")}, Python ${esc(r.provenance?.python || "?")}）</td></tr>
        <tr><th>条件</th><td><code>${esc(JSON.stringify(r.params || {}))}</code></td></tr>
        <tr><th>手</th><td><code>${esc(JSON.stringify(r.hand || null))}</code></td></tr>
        <tr><th>機械</th><td><code>${esc(JSON.stringify(r.data || {})).slice(0, 600)}</code></td></tr></table></details>
      <div class="row"><button class="small" data-attach="${r.id}">この記録をカードにつける</button><a href="${esc(nbUrl((pz(r.exp) || {}).notebook || ""))}" target="_blank" rel="noopener"><button class="small quiet">同じノートをもう一度</button></a><a href="${esc(runUrl(r.exp))}" target="_blank" rel="noopener"><button class="small quiet">公開の実行記録</button></a><button class="small quiet" data-rundel="${r.id}">消す</button></div></div>`).join("") : '<p class="muted">まだ記録はありません。パズルの頁からノートを開き、最後のセルまで実行すると届きます。</p>'}`;
  el.querySelector("#r-import").addEventListener("change", ev => { const files = Array.from(ev.target.files || []); let n = 0; Promise.all(files.map(f => f.text().then(t => { const o = JSON.parse(t); if (o && o.type === "evidence") { receiveRun(o, "file"); n++; } }).catch(() => {}))).then(() => { toast(`${n} 件読み込みました`); renderRuns(); }); });
  bindRunOps(el, renderRuns);
}

// =====================================================================
// わたしの地図：カードと、その接地リンク（手・記録・ノート・公開記録・教科書の言葉）
// =====================================================================
function cardHtml(c) {
  const ev = c.links.map(l => l.kind === "hand" ? `<span class="badge soft">手 ${esc(l.t)}</span>` : l.kind === "run" ? (runById(l.run) ? `<span class="badge ${(() => { const r = runById(l.run), k = canon[r.exp]; const cmp = k ? compareRuns(r, k) : null; return cmp && cmp.sameParams && cmp.sameData ? "ok" : ""; })()}" title="ノートの実行記録">記録 ${esc(runById(l.run).provenance?.t || "")}（版 ${esc(runById(l.run).provenance?.nb_sha || "?")}）</span>` : `<span class="badge ng">記録（消えている）</span>`) : l.kind === "notebook" ? `<a href="${esc(nbUrl(l.file))}" target="_blank" rel="noopener"><span class="badge soft">ノート ${esc(l.file)}</span></a>` : "").join(" ");
  return `<div class="card ${c.type === "q" ? "q" : c.type === "rule" ? "rule" : c.type === "hand" ? "hand" : ""}" data-id="${c.id}">
    <div class="head"><span class="type">${TYPES[c.type]}</span>${c.puzzle && pz(c.puzzle) ? `<span class="muted">${esc(pz(c.puzzle).title)}</span>` : ""}${c.status ? `<span class="badge soft">${esc(c.status)}</span>` : ""}<span class="muted">${esc(c.t)}</span></div>
    <div class="txt">${esc(c.text)}</div>${c.note ? `<div class="muted">わけ・メモ：${esc(c.note)}</div>` : ""}${c.book ? `<div class="muted">教科書ではたぶん「${esc(BOOK[c.book])}」</div>` : ""}
    <div class="ev">${ev || '<span class="muted">接地：まだ</span>'}</div>
    <div class="ops"><button data-op="seed" data-id="${c.id}">問いの種</button><button data-op="edit" data-id="${c.id}">書き直す</button><button data-op="note" data-id="${c.id}">わけ・メモ</button><button data-op="status" data-id="${c.id}">状態</button><button data-op="book" data-id="${c.id}">教科書では？</button>${c.puzzle ? `<button data-op="nb" data-id="${c.id}">ノートを開く</button>` : ""}<button data-op="del" data-id="${c.id}" class="quiet">消す</button></div>
    <div class="seeds" id="seeds-${c.id}"></div></div>`;
}
function bindCardOps(el, rerender) {
  el.querySelectorAll("[data-op]").forEach(b => b.addEventListener("click", () => {
    const c = cardById(b.dataset.id), op = b.dataset.op;
    if (op === "seed") { const box = el.querySelector(`#seeds-${c.id}`); box.innerHTML = SEEDS.map(([nm], i) => `<button data-seed="${i}">${nm}</button>`).join(""); box.querySelectorAll("button").forEach(sb => sb.addEventListener("click", () => { const [nm, fn] = SEEDS[+sb.dataset.seed]; const t = prompt(`問いの種「${nm}」：自分の言葉で`, fn(c)); if (t && t.trim()) { addCard({type: "q", text: t.trim(), puzzle: c.puzzle, parent: c.id}); rerender(); } })); }
    else if (op === "edit") { const t = prompt("書き直す", c.text); if (t !== null && t.trim()) { c.text = t.trim(); saveState(); rerender(); } }
    else if (op === "note") { const t = prompt("わけ・メモ（なぜそうなる？ 手で見たことと機械の結果、どうつながる？）", c.note || ""); if (t !== null) { c.note = t.trim(); saveState(); rerender(); } }
    else if (op === "status") { const t = prompt("状態（例：手で 20 まで／機械で 10000 まで反例なし／反例 36 で外れ／わけが言える）", c.status || ""); if (t !== null) { c.status = t.trim(); saveState(); rerender(); } }
    else if (op === "book") { const keys = Object.keys(BOOK); const t = prompt("教科書の地図では、これに近いのはどれ？（番号。0 でなし）\n" + keys.map((k, i) => `${i + 1}: ${BOOK[k]}`).join("\n"), c.book ? String(keys.indexOf(c.book) + 1) : "0"); if (t !== null) { const i = +t; c.book = i >= 1 && i <= keys.length ? keys[i - 1] : null; saveState(); rerender(); } }
    else if (op === "nb") { const p = pz(c.puzzle); if (p) window.open(nbUrl(p.notebook), "_blank"); }
    else if (op === "del") { if (confirm("このカードを消す？")) { state.cards = state.cards.filter(x => x.id !== c.id); state.cards.forEach(x => { if (x.parent === c.id) x.parent = c.parent; }); saveState(); rerender(); } }
  }));
}
function renderCards() {
  const el = $("#view-cards"), cards = state.cards;
  const kids = id => cards.filter(c => c.parent === id);
  const one = c => cardHtml(c) + (kids(c.id).length ? `<div class="kids">${kids(c.id).map(one).join("")}</div>` : "");
  const roots = cards.filter(c => !c.parent || !cardById(c.parent));
  const grounded = cards.filter(c => c.links.some(l => l.kind === "run") && c.links.some(l => l.kind === "hand" || cards.some(h => h.type === "hand" && h.puzzle === c.puzzle)));
  el.innerHTML = `<h2>${esc(state.name)}の地図</h2><p class="muted">カードは自分の言葉。カードの下の印が「接地」——手でやった記録、ノートの実行記録（版と条件つき）、ノートそのもの、教科書の言葉。手と機械の両方がついたカードは、誰かが同じノートを同じ条件で動かして確かめられる。</p>
    <div class="row"><button class="small" data-new="notice">気づき</button><button class="small" data-new="q">問い</button><button class="small" data-new="guess">予想</button><button class="small" data-new="rule">きまり</button></div>
    ${roots.map(one).join("") || '<p class="muted">まだ何もない。それでいい。パズルの頁から始まる。</p>'}
    <h3>教科書の言葉との結びつき</h3><ul style="padding-left:18px">${Object.entries(BOOK).map(([k, v]) => { const cs = cards.filter(c => c.book === k); return `<li>${cs.length ? `<b>${esc(v)}</b> ← ${cs.map(c => `「${esc(c.text)}」`).join("、")}` : `<span class="muted">${esc(v)}</span>`}</li>`; }).join("")}</ul>
    <h3>保存</h3><div class="row"><button class="small" id="c-export">JSON に書き出す（カードと記録）</button><label><button class="small quiet" onclick="this.nextElementSibling.click()">読み込む</button><input type="file" id="c-import" accept="application/json" style="display:none"></label></div>`;
  el.querySelectorAll("[data-new]").forEach(b => b.addEventListener("click", () => { const t = prompt({notice: "気づき（自分の言葉で）", q: "問い", guess: "予想", rule: "きまり"}[b.dataset.new], ""); if (t && t.trim()) { addCard({type: b.dataset.new, text: t.trim(), puzzle: null}); renderCards(); } }));
  bindCardOps(el, renderCards);
  el.querySelector("#c-export").addEventListener("click", () => { const blob = new Blob([JSON.stringify(state, null, 1)], {type: "application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "my_lab.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); });
  el.querySelector("#c-import").addEventListener("change", ev => { const f = ev.target.files[0]; if (!f) return; f.text().then(t => { const s = JSON.parse(t); if (!s.cards) throw 0; s.runs = s.runs || []; state = s; saveState(); renderCards(); toast("読み込みました"); }).catch(() => toast("読み込めませんでした")); });
}

// =====================================================================
// 設定・起動
// =====================================================================
function renderSettings() {
  const el = $("#view-set");
  el.innerHTML = `<h2>設定</h2><div>名前</div><input type="text" id="s-name" value="${esc(state.name)}" style="width:100%">
    <h3>ノート（JupyterLite）</h3><div>JupyterLite の場所</div><input type="text" id="s-base" value="${esc(settings.liteBase)}" style="width:100%">
    <div class="row"><label><input type="radio" name="s-ui" value="notebooks" ${settings.liteUI === "notebooks" ? "checked" : ""}> Notebook 画面</label><label><input type="radio" name="s-ui" value="lab" ${settings.liteUI === "lab" ? "checked" : ""}> Lab 画面</label></div>
    <div>公開の実行記録の場所（CI が置く runs/）</div><input type="text" id="s-runs" value="${esc(settings.runsBase)}" style="width:100%">
    <div class="row"><button class="primary" id="s-save">保存</button><button class="quiet" id="s-reset">地図と記録を白紙にする</button></div>
    <h3>この形について</h3><p class="muted">入口は数のパズル。まず手で（物を動かす実験）、次にノートで（機械に手伝わせる実験）。ノートの最後のセルが、結果・条件・ノート本文の指紋を「記録」として送る。記録はカードにつき、誰でも同じノートを同じ条件で動かして確かめられる——研究の再現性と同じ意味での接地。</p>`;
  el.querySelector("#s-save").addEventListener("click", () => { state.name = el.querySelector("#s-name").value.trim() || state.name; settings.liteBase = el.querySelector("#s-base").value.trim() || "../"; settings.liteUI = el.querySelector("input[name=s-ui]:checked").value; settings.runsBase = el.querySelector("#s-runs").value.trim() || "../runs/"; saveSettings(); saveState(); toast("保存しました"); });
  el.querySelector("#s-reset").addEventListener("click", () => { if (confirm("カードと記録を全部消して白紙にする？（JSON に書き出してからがおすすめ）")) { state = newState(state.name); saveState(); renderCards(); renderRuns(); } });
}
function showView(v) { ui.view = v; document.querySelectorAll("nav.views button").forEach(b => b.classList.toggle("active", b.dataset.view === v)); document.querySelectorAll(".view").forEach(p => p.classList.toggle("active", p.id === "view-" + v)); ({door: renderDoor, runs: renderRuns, cards: renderCards, set: renderSettings})[v](); }
function init() {
  settings = loadSettings(); state = loadState();
  if (!state) { const name = prompt("きみの名前（地図につけます）", "わたし") || "わたし"; state = newState(name.trim() || "わたし"); saveState(); }
  document.querySelectorAll("nav.views button").forEach(b => b.addEventListener("click", () => showView(b.dataset.view)));
  if (typeof BroadcastChannel !== "undefined") { const ch = new BroadcastChannel("kg-map"); ch.onmessage = ev => { try { const msg = typeof ev.data === "string" ? JSON.parse(ev.data) : ev.data; if (msg && msg.type === "evidence") receiveRun(msg, "notebook"); } catch (e) {} }; }
  const m = location.hash.match(/^#puzzle=([a-z0-9_]+)/); if (m && pz(m[1])) ui.puzzle = m[1];
  showView("door");
}
if (typeof window !== "undefined" && typeof document !== "undefined") { if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init(); }
</script>
</body>
</html>
