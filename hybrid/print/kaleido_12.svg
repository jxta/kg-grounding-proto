<text class="s" x="112" y="118">ここに描く</text>
<text class="s" x="15" y="258">扇形を 1 つ選んで、好きな線や形を描く。となりの扇形には境目の線で「裏返し」て写す（トレーシングペーパーか、折って透かす）。</text>
<text class="s" x="15" y="263.2">その次は「回して」写す。一周させる。裏返しなし（回すだけ）の版も作って、見比べる。</text>
<text class="f" x="15" y="284">名前：＿＿＿＿＿＿＿＿　　気づいたこと：</text>
