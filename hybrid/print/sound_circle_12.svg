<text class="s" x="15" y="258">ドから、k ずつ時計回りに進んで線を結ぶ（k = 7 なら ド → ソ → レ → …）。通った音を順に下に書く。</text>
<text class="s" x="15" y="263.2">通った音：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿　　全部の音を通った？　糸は何本？</text>
