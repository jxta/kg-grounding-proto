<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<style>text{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif}.t{font-size:6.5px;fill:#111;text-anchor:middle}.n{font-size:3.6px;fill:#444;text-anchor:middle}.s{font-size:3.6px;fill:#333}.f{font-size:3.8px;fill:#333}.c{font-size:3.4px;fill:#111;text-anchor:middle}.g{font-size:4.2px;fill:#111;text-anchor:middle}.d{font-size:5px;fill:#111;text-anchor:middle;font-weight:bold}circle.d{fill:#111}rect.q{fill:#fff;stroke:#999;stroke-width:.25}line.l{stroke:#999;stroke-width:.3}line.a{stroke:#111;stroke-width:.5}line.k{stroke:#bbb;stroke-width:.25}</style>
<rect width="210" height="297" fill="#fff"/>
<text class="t" x="105" y="22">サイコロの三角形</text>
<polygon points="25,230 185,230 105.0,91.4" fill="none" stroke="#111" stroke-width=".5"/>
<text class="d" x="22" y="238">A：1・2</text>
<text class="d" x="188" y="238">B：3・4</text>
<text class="d" x="105.0" y="86.4">C：5・6</text>
<text class="s" x="15" y="258">三角形の中のどこかに点を 1 つ打つ。サイコロを振る：1・2 なら A、3・4 なら B、5・6 なら C。いまの点とその角との「真ん中」に新しい点を打つ。</text>
<text class="s" x="15" y="263.2">これを 30 回くり返す（定規で真ん中を取る）。点はどこに集まる？ 入らない場所はある？</text>
<text class="f" x="15" y="284">名前：＿＿＿＿＿＿＿＿　　打った点 = ＿＿ 個　　気づいたこと：</text>
</svg>