<text class="s" x="15" y="258">上から順に：2 で割れるなら黄。割れなければ 3 で試す → 緑。次に 5 → 青、7 → 赤。どれでも割れなければ素数 → 黒。</text>
<text class="s" x="15" y="263.2">色ごとの数を数える：黄 ＿＿　緑 ＿＿　青 ＿＿　赤 ＿＿　黒 ＿＿　白 ＿＿（合計 100）</text>
